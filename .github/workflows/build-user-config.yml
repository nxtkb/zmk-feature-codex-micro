name: Reusable Codex user config build

on:
  workflow_call:
    inputs:
      build_matrix_path:
        description: Path to the Codex build matrix
        default: codex-build.yaml
        required: false
        type: string
      config_path:
        description: Path containing the west manifest
        default: config
        required: false
        type: string
      zmk_config_path:
        description: ZMK config path after west update; defaults to config_path
        default: ""
        required: false
        type: string
      archive_name:
        description: Merged firmware artifact name
        default: codex-firmware
        required: false
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Codex build matrix
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@v6

      - name: Read build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix_content=$(yq -o=json -I=0 '.' '${{ inputs.build_matrix_path }}')
          test -n "${matrix_content}"
          test "${matrix_content}" != "null"
          echo "build_matrix=${matrix_content}" >> "${GITHUB_OUTPUT}"

  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build Codex firmware
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout caller
        uses: actions/checkout@v6

      - name: Prepare workspace
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          SHIELD: ${{ matrix.shield }}
          SNIPPET: ${{ matrix.snippet }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}
        run: |
          set -euo pipefail
          echo "build_dir=$(mktemp -d)" >> "${GITHUB_ENV}"

          if [[ -e zephyr/module.yml ]]; then
            base_dir="${RUNNER_TEMP}/zmk-workspace"
            manifest_dir="${base_dir}/config"
            mkdir -p "${manifest_dir}"
            cp -R "${{ inputs.config_path }}/." "${manifest_dir}/"
            extra_modules="-DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}"
          else
            base_dir="${GITHUB_WORKSPACE}"
            manifest_dir="${base_dir}/${{ inputs.config_path }}"
            extra_modules=""
          fi

          zmk_config_path="${{ inputs.zmk_config_path }}"
          if [[ -z "${zmk_config_path}" ]]; then
            zmk_config="${manifest_dir}"
          else
            zmk_config="${base_dir}/${zmk_config_path}"
          fi

          echo "base_dir=${base_dir}" >> "${GITHUB_ENV}"
          echo "manifest_dir=${manifest_dir}" >> "${GITHUB_ENV}"
          echo "zmk_config=${zmk_config}" >> "${GITHUB_ENV}"
          echo "extra_modules=${extra_modules}" >> "${GITHUB_ENV}"
          echo "artifact_name=${ARTIFACT_NAME:-${SHIELD:+${SHIELD// /_}-}${BOARD//\//_}-codex}" >> "${GITHUB_ENV}"

      - name: Initialize west workspace
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.manifest_dir }}"

      - name: Update west projects
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: Apply Codex ZMK compatibility patch
        working-directory: ${{ env.base_dir }}
        run: west patch -sm zmk-feature-codex-micro apply

      - name: Export Zephyr CMake package
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: Build ${{ matrix.artifact-name }}
        working-directory: ${{ env.base_dir }}
        shell: bash
        run: >-
          west build -s zmk/app -p -d "${{ env.build_dir }}"
          -b "${{ matrix.board }}" ${{ matrix.snippet && format('-S "{0}"', matrix.snippet) || '' }} --
          ${{ matrix.shield && format('-DSHIELD="{0}"', matrix.shield) || '' }}
          -DZMK_CONFIG="${{ env.zmk_config }}"
          ${{ env.extra_modules }}
          ${{ matrix.cmake-args }}

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p "${{ env.build_dir }}/artifacts"
          cp "${{ env.build_dir }}/zephyr/zmk.uf2" \
            "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Codex firmware
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ inputs.archive_name }}
          pattern: artifact-*
          delete-merged: true
