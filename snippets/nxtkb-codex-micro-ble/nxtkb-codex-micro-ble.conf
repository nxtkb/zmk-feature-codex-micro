CONFIG_NXTKB_CODEX_MICRO_BLE=y

# macOS keeps the report ID in BLE SetReport writes, producing a 64-byte
# value. The ATT opcode and handle require a negotiated ATT MTU of 67.
CONFIG_BT_L2CAP_TX_MTU=67
CONFIG_BT_BUF_ACL_RX_SIZE=71

# macOS may keep the default ATT MTU (23) and send the 63-byte output report
# as four prepare-write fragments. Keep enough buffers for Zephyr to
# reassemble the complete report before invoking the Codex write callback.
CONFIG_BT_ATT_PREPARE_COUNT=4
